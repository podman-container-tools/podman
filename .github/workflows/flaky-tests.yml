name: Flaky Test Experiment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          git rev-parse HEAD

      - name: Build Podman
        run: |
          make BUILDTAGS="selinux seccomp" bin/podman

      - name: Run test
        run: |
          echo "Test goes here"
      - name: Inspect test directory
        run: |
          echo "=== Test directory ==="
          find test -maxdepth 3 -type f | sort
