version: "2"

run:
  build-tags:
    - apparmor
    - seccomp
    - selinux

formatters:
  enable:
    - gofumpt

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - decorder
    - durationcheck
    - errchkjson
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - goprintffuncname
    - grouper
    - iface
    - inamedparam
    - makezero
    - mirror
    - misspell
    - modernize
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - whitespace
  exclusions:
    presets:
      - comments
      - std-error-handling
  settings:
    staticcheck:
      checks:
        - all
        - -QF1008 # https://staticcheck.dev/docs/checks/#QF1008 Omit embedded fields from selector expression.
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
